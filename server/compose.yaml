services:
  api:
    build:
      context: .
    image: az3166-gateway-api:latest
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/telemetry.db
      DEVICE_API_KEY: ${DEVICE_API_KEY:?DEVICE_API_KEY is required}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:?DASHBOARD_USERNAME is required}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?DASHBOARD_PASSWORD is required}
    volumes:
      - telemetry-data:/data
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required}
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  telemetry-data:
  caddy-data:
  caddy-config:
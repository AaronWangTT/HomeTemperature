name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Server
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.11
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --requirement server/requirements-dev.txt

      - name: Run tests
        env:
          PYTHONPATH: server
        run: python -m pytest server/tests -q

      - name: Compile Python sources
        run: python -m compileall -q server/app server/tests

      - name: Check shell syntax
        run: bash -n server/scripts/*.sh

      - name: Validate Compose configuration
        run: docker compose --file server/compose.yaml --env-file server/.env.example config --quiet

      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          --env ACME_EMAIL=ci@example.com
          --env PUBLIC_HOST=telemetry.example.com
          --volume "${PWD}/server/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10.2-alpine
          caddy validate --config /etc/caddy/Caddyfile

      - name: Build API image
        run: docker build --tag home-temperature-api:ci server

  firmware:
    name: Firmware compile
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Cache Arduino IDE
        id: arduino-ide-cache
        uses: actions/cache@v4
        with:
          path: .tools/arduino-1.8.19
          key: arduino-ide-1.8.19-windows

      - name: Download Arduino IDE 1.8.19
        if: steps.arduino-ide-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .tools -Force | Out-Null
          Invoke-WebRequest `
            -Uri https://downloads.arduino.cc/arduino-1.8.19-windows.zip `
            -OutFile .tools/arduino-1.8.19-windows.zip
          Expand-Archive `
            -Path .tools/arduino-1.8.19-windows.zip `
            -DestinationPath .tools
          Remove-Item .tools/arduino-1.8.19-windows.zip

      - name: Configure Arduino IDE path
        shell: pwsh
        run: |
          $arduino = (Resolve-Path ".tools/arduino-1.8.19/arduino_debug.exe").Path
          "ARDUINO_IDE_PATH=$arduino" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Cache AZ3166 board package
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Arduino15
          key: az3166-core-2.0.0-windows

      - name: Install pinned AZ3166 toolchain
        shell: pwsh
        run: >-
          & ./firmware/tools/Install-Az3166Toolchain.ps1
          -ArduinoExecutable $env:ARDUINO_IDE_PATH

      - name: Verify production and test sketches
        shell: pwsh
        run: ./firmware/tests/run-all-tests.ps1 -Action Verify